apiVersion: v1
kind: ServiceAccount
metadata:
  name: example-app-sa
  namespace: example-app
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT-ID:role/example-app-role
  labels:
    app: example-app
    organization: "acme-corp"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: example-app
  name: example-app-role
  labels:
    app: example-app
    organization: "acme-corp"
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "replicasets"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: example-app-rolebinding
  namespace: example-app
  labels:
    app: example-app
    organization: "acme-corp"
subjects:
- kind: ServiceAccount
  name: example-app-sa
  namespace: example-app
roleRef:
  kind: Role
  name: example-app-role
  apiGroup: rbac.authorization.k8s.io
