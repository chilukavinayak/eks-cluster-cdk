apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: example-app-network-policy
  namespace: example-app
  labels:
    app: example-app
    organization: "acme-corp"
spec:
  podSelector:
    matchLabels:
      app: example-app
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow ingress from load balancer
  - from: []
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from same namespace
  - from:
    - namespaceSelector:
        matchLabels:
          name: example-app
    ports:
    - protocol: TCP
      port: 8080
  # Allow ingress from monitoring namespace for metrics
  - from:
    - namespaceSelector:
        matchLabels:
          name: monitoring
    ports:
    - protocol: TCP
      port: 9090
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  # Allow HTTPS for external APIs
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow HTTP for internal services
  - to: []
    ports:
    - protocol: TCP
      port: 80
  # Allow database connections (PostgreSQL)
  - to:
    - namespaceSelector:
        matchLabels:
          name: database
    ports:
    - protocol: TCP
      port: 5432
  # Allow Redis connections
  - to:
    - namespaceSelector:
        matchLabels:
          name: cache
    ports:
    - protocol: TCP
      port: 6379
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-default
  namespace: example-app
  labels:
    app: example-app
    organization: "acme-corp"
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
