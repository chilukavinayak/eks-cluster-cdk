apiVersion: v1
kind: Service
metadata:
  name: example-app-service
  namespace: example-app
  labels:
    app: example-app
    organization: "acme-corp"
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-internal: "true"
    service.beta.kubernetes.io/aws-load-balancer-backend-protocol: "tcp"
    service.beta.kubernetes.io/aws-load-balancer-cross-zone-load-balancing-enabled: "true"
spec:
  selector:
    app: example-app
  ports:
  - name: http
    port: 80
    targetPort: http
    protocol: TCP
  - name: https
    port: 443
    targetPort: http
    protocol: TCP
  type: LoadBalancer
  sessionAffinity: None
---
apiVersion: v1
kind: Service
metadata:
  name: example-app-metrics
  namespace: example-app
  labels:
    app: example-app
    organization: "acme-corp"
    monitoring: "prometheus"
spec:
  selector:
    app: example-app
  ports:
  - name: metrics
    port: 9090
    targetPort: metrics
    protocol: TCP
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: example-app-internal
  namespace: example-app
  labels:
    app: example-app
    organization: "acme-corp"
spec:
  selector:
    app: example-app
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
  type: ClusterIP
