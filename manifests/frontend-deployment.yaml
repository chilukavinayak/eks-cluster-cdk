apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviewdeck-frontend
  namespace: interviewdeck
  labels:
    app: interviewdeck-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interviewdeck-frontend
  template:
    metadata:
      labels:
        app: interviewdeck-frontend
    spec:
      containers:
      - name: frontend
        image: 276824024738.dkr.ecr.us-east-1.amazonaws.com/interviewdeck-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: interviewdeck-frontend
  namespace: interviewdeck
  labels:
    app: interviewdeck-frontend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 80
    protocol: TCP
    name: http
  selector:
    app: interviewdeck-frontend
