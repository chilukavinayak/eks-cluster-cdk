apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviewdeck-backend
  namespace: interviewdeck
  labels:
    app: interviewdeck-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interviewdeck-backend
  template:
    metadata:
      labels:
        app: interviewdeck-backend
    spec:
      containers:
      - name: backend
        image: 276824024738.dkr.ecr.us-east-1.amazonaws.com/interviewdeck-backend:latest
        ports:
        - containerPort: 8080
          name: auth-service
        - containerPort: 8081
          name: content-service
        - containerPort: 8082
          name: payment-service
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "prod"
        - name: SERVER_PORT
          value: "8080"
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: interviewdeck-backend
  namespace: interviewdeck
  labels:
    app: interviewdeck-backend
spec:
  type: ClusterIP
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  selector:
    app: interviewdeck-backend
