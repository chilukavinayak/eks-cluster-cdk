apiVersion: apps/v1
kind: Deployment
metadata:
  name: interviewdeck-frontend
  namespace: interviewdeck
  labels:
    app: interviewdeck-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interviewdeck-frontend
  template:
    metadata:
      labels:
        app: interviewdeck-frontend
    spec:
      containers:
      - name: frontend
        image: 276824024738.dkr.ecr.us-east-1.amazonaws.com/interviewdeck-frontend:latest
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: interviewdeck-frontend
  namespace: interviewdeck
  labels:
    app: interviewdeck-frontend
spec:
  selector:
    app: interviewdeck-frontend
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: interviewdeck-ingress
  namespace: interviewdeck
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:276824024738:certificate/6f8db481-1c6b-446c-9501-bb739963b44b"
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80},{"HTTPS":443}]'
spec:
  rules:
  - host: interviewdeck.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: interviewdeck-frontend
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: interviewdeck-backend
            port:
              number: 8080
