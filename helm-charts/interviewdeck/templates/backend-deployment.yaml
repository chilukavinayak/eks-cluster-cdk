{{- if .Values.backend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "interviewdeck.fullname" . }}-backend
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interviewdeck.labels" . | nindent 4 }}
    component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      {{- include "interviewdeck.selectorLabels" . | nindent 6 }}
      component: backend
  template:
    metadata:
      labels:
        {{- include "interviewdeck.selectorLabels" . | nindent 8 }}
        component: backend
    spec:
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "interviewdeck.serviceAccountName" . }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: backend
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.global.imageRegistry }}/{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          ports:
            - name: auth
              containerPort: {{ .Values.backend.service.ports.auth }}
              protocol: TCP
            - name: content
              containerPort: {{ .Values.backend.service.ports.content }}
              protocol: TCP
            - name: payment
              containerPort: {{ .Values.backend.service.ports.payment }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "interviewdeck.fullname" . }}-backend-config
            - secretRef:
                name: {{ include "interviewdeck.fullname" . }}-backend-secrets
          env:
            - name: SERVER_PORT
              value: "{{ .Values.backend.service.ports.auth }}"
          livenessProbe:
            {{- toYaml .Values.backend.livenessProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.backend.readinessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
