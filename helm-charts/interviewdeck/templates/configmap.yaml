{{- if .Values.backend.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "interviewdeck.fullname" . }}-backend-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interviewdeck.labels" . | nindent 4 }}
    component: backend
data:
  {{- range $key, $value := .Values.backend.env }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
