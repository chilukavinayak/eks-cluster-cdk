{{- if .Values.backend.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "interviewdeck.fullname" . }}-backend-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "interviewdeck.labels" . | nindent 4 }}
    component: backend
type: Opaque
data:
  {{- range $key, $value := .Values.backend.secrets }}
  {{- if $value }}
  {{ $key }}: {{ $value }}
  {{- end }}
  {{- end }}
{{- end }}
