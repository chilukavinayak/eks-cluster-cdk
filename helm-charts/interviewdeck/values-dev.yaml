# Development environment values for interviewdeck
# This is a YAML-formatted file.

# Frontend configuration for development
frontend:
  replicaCount: 1
  resources:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "128Mi"
      cpu: "100m"

# Backend configuration for development
backend:
  replicaCount: 1
  resources:
    requests:
      memory: "256Mi"
      cpu: "125m"
    limits:
      memory: "512Mi"
      cpu: "250m"
  
  # Development environment variables
  env:
    SPRING_PROFILES_ACTIVE: "dev"
    SPRING_DATASOURCE_URL: "jdbc:h2:mem:testdb"
    SPRING_DATASOURCE_USERNAME: "sa"
    SPRING_JPA_HIBERNATE_DDL_AUTO: "create-drop"
    SPRING_H2_CONSOLE_ENABLED: "true"
    JWT_SECRET: "dev-secret-key-that-is-at-least-256-bits-long"

# Ingress configuration for development
ingress:
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP":80}]'
  
  hosts:
    - host: dev.interviewdeck.io
      paths:
        - path: /
          pathType: Prefix
          service: frontend

# Disable SSL for development
ssl:
  enabled: false

# Autoscaling disabled for development
autoscaling:
  enabled: false
