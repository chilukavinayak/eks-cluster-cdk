apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: demo-app
  labels:
    app: frontend
    component: ui
    tier: frontend
spec:
  selector:
    app: frontend
    component: ui
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-service-account
  namespace: demo-app
  labels:
    app: frontend
    component: ui
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851725444786:role/FrontendServiceRole
