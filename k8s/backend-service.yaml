apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: demo-app
  labels:
    app: backend
    component: api
    tier: backend
spec:
  selector:
    app: backend
    component: api
  ports:
  - port: 3001
    targetPort: 3001
    protocol: TCP
    name: http
  type: ClusterIP
  sessionAffinity: None
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-service-account
  namespace: demo-app
  labels:
    app: backend
    component: api
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::851725444786:role/BackendServiceRole
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-secret-provider
  namespace: demo-app
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "eks-sample-secret"
        objectType: "secretsmanager"
        jmesPath:
          - path: "db_host"
            objectAlias: "db_host"
          - path: "db_port"
            objectAlias: "db_port"
          - path: "db_name"
            objectAlias: "db_name"
          - path: "username"
            objectAlias: "db_username"
          - path: "password"
            objectAlias: "db_password"
  secretObjects:
  - secretName: app-secrets
    type: Opaque
    data:
    - objectName: "db_host"
      key: "db_host"
    - objectName: "db_port"
      key: "db_port"
    - objectName: "db_name"
      key: "db_name"
    - objectName: "db_username"
      key: "db_username"
    - objectName: "db_password"
      key: "db_password"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: backend-config-provider
  namespace: demo-app
spec:
  provider: aws
  parameters:
    objects: |
      - objectName: "/eks/app/feature-flags/new-ui"
        objectType: "ssmparameter"
        objectAlias: "feature_new_ui"
      - objectName: "/eks/app/feature-flags/analytics"
        objectType: "ssmparameter"
        objectAlias: "feature_analytics"
      - objectName: "/eks/app/config/environment"
        objectType: "ssmparameter"
        objectAlias: "environment"
  secretObjects:
  - secretName: app-config
    type: Opaque
    data:
    - objectName: "feature_new_ui"
      key: "feature_new_ui"
    - objectName: "feature_analytics"
      key: "feature_analytics"
    - objectName: "environment"
      key: "environment"
