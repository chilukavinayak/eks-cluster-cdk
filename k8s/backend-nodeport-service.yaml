apiVersion: v1
kind: Service
metadata:
  name: backend-nodeport-service
  namespace: demo-app
  labels:
    app: backend
    component: api
    tier: backend
spec:
  type: NodePort
  ports:
    - name: http
      port: 3001
      targetPort: 3001
      nodePort: 30001
      protocol: TCP
  selector:
    app: backend
    component: api
